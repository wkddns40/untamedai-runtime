title = "untamed-companion-runtime gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "supabase-service-role-key"
description = "Supabase service role JWT"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}'''
keywords = ["service_role", "supabase"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9_-]{20,}'''
keywords = ["openai", "api_key"]

[[rules]]
id = "polar-secret"
description = "Polar webhook or API secret"
regex = '''(?i)(polar).{0,30}(secret|token|key).{0,10}[:=]\s*['"]?[A-Za-z0-9_\-]{16,}'''
keywords = ["polar"]

