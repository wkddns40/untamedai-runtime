[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "untamedai-runtime"
version = "0.4.0"
description = "LangGraph-based runtime for emotionally adaptive AI companions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Untamed AI" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "langgraph>=0.6,<2",
]

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]
supabase = [
  "supabase>=2,<3",
]
openai = [
  "openai>=1,<3",
]
postgres = [
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.1,<4",
]
dev = [
  "build>=1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/untamed_companion"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["untamed_companion"]
strict = true
